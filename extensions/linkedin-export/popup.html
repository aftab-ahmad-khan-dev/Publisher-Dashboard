<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Export</title>
    <style>
      body {
        margin: 0;
        font: 13px/1.45 system-ui, -apple-system, sans-serif;
        color: #e2e8f0;
        background: #0b1220;
        width: 320px;
      }
      .wrap {
        padding: 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 700;
      }
      p {
        margin: 0 0 12px;
        color: #94a3b8;
        font-size: 11px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 650;
        font-size: 12px;
        cursor: pointer;
        background: #4f46e5;
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .secondary {
        margin-top: 8px;
        background: #1e293b;
        color: #cbd5e1;
      }
      .status {
        margin-top: 10px;
        font-size: 11px;
        color: #a5b4fc;
        white-space: pre-wrap;
      }
      .warn {
        margin-top: 10px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid rgba(245, 158, 11, 0.25);
        background: rgba(245, 158, 11, 0.08);
        color: #fde68a;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Export visible contacts</h1>
      <p>
        Reads only the LinkedIn page you have open. Download CSV, then upload it in Mail Box →
        Campaigns lead import.
      </p>
      <button id="exportBtn" type="button">Scan page & download CSV</button>
      <button id="copyBtn" class="secondary" type="button" disabled>Copy as CSV</button>
      <div id="status" class="status"></div>
      <div class="warn">
        Compliant use only: export profiles/lists you can already see while logged in. Do not use
        for mass scraping or automated harvesting.
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
